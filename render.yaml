services:
  - type: web
    name: slate-task-list
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:../data/tasks.db
      - key: JWT_SECRET
        generateValue: true
